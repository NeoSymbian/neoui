# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/neoui-proto", "crates/neoui-render", "crates/neoui-host", "crates/neoui-term", "crates/neoui-files", "crates/neoui-contacts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
neoui-proto = { path = "crates/neoui-proto" }
neoui-render = { path = "crates/neoui-render" }
neoui-contacts = { path = "crates/neoui-contacts" }
# NeoSymbian/telephony (Apache-2.0): dial-string rules, number matching, the caller line
phone-rules = { git = "https://github.com/NeoSymbian/telephony", rev = "2474d71738b8a94a49e9d82e7d5272d0d072c40e" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = { version = "=1.18.1", features = ["sdf-fonts"] }
winit = "=0.30.13"
softbuffer = "=0.4.8"
png = "=0.18.1"
