# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = ["crates/neoui-proto", "crates/neoui-render", "crates/neoui-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
neoui-proto = { path = "crates/neoui-proto" }
neoui-render = { path = "crates/neoui-render" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = { version = "=1.18.1", features = ["sdf-fonts"] }
winit = "=0.30.13"
softbuffer = "=0.4.8"
png = "=0.18.1"
