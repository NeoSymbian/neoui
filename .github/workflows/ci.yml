# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]     # a PR branch runs once, as its pull_request
    paths-ignore: ['**/*.md', 'design/**', 'snapshots/**']
  pull_request:
    paths-ignore: ['**/*.md', 'design/**', 'snapshots/**']

# a newer push to the same PR cancels its older run; main keeps one result per commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      # winit/softbuffer (neoui-host) load X11/Wayland at runtime; headers for safety.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: no_std build (Cortex-M stand-in for the Symbian ARM user side)
        run: cargo build -p neoui-proto -p neoui-render -p neoui-term -p neoui-files -p neoui-contacts --target thumbv7em-none-eabihf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots/
