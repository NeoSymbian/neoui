# SPDX-License-Identifier: Apache-2.0
name: syborg

# The launcher on the 2010 Symbian user side: build symbian/ (SYSSTART.EXE) for armv5te, put it in the Syborg ROM
# with NeoSymbian/build (estart then runs it instead of the window server) plus the Clock app, boot on QEMU,
# drive it through the QEMU monitor (open Clock, tap it, go back) and check the serial log and the screen. Only the screenshot and logs are published,
# never the ROM (it links Slint under GPL-3.0 with EPL-1.0 Symbian code).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syborg:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: neoui

      - uses: actions/checkout@v4
        with:
          repository: NeoSymbian/build
          path: build

      - name: Rust (toolchain pinned by symbian/rust-toolchain.toml)
        working-directory: neoui/symbian
        run: |
          rustup toolchain install   # reads rust-toolchain.toml
          cargo fmt --all --check
          cargo clippy --workspace --release --target armv5te-none-eabi -Zbuild-std=core,alloc,compiler_builtins -- -D warnings
          cargo arm --workspace
          mkdir -p ../../build/rust
          cp target/armv5te-none-eabi/release/{libneoui_symbian,libneoclock,libneoterm,libneofiles,libneodevtools}.a exes.txt ../../build/rust/

      # NEOTEST.EXE (e32-rs's on-device tests), so ESHELL in the Terminal app has a 2010-style text program to run
      - name: e32-rs neotest
        run: |
          git clone -q --depth 1 https://github.com/NeoSymbian/e32-rs.git
          cd e32-rs && cargo arm -p neotest
          cp target/armv5te-none-eabi/release/libneotest.a ../build/rust/
          grep '^NEOTEST.EXE' symbian/exes.txt >> ../build/rust/exes.txt

      - name: Fetch the Symbian sources
        working-directory: build
        run: ./fetch.sh

      - name: Build the ROM (SYSSTART.EXE = the UI server, no window server; NEOCLOCK/NEOTERM/NEOFILES.EXE = apps)
        working-directory: build
        run: ./build.sh

      # A phone-shaped screen with odd sizes (half of the Pixel's 1079x2159 touch range), so the UI must adapt to
      # whatever the device reports. The path is the design's contract, in screen pixels: Apps in the dock
      # (270,1000); Clock in the menu (449,530); a tap inside the Clock app (270,500); Back in the toolbar (88,1033).
      # Then the Terminal app: Apps (270,1000), Terminal (449,735), `dir` on the system keyboard (R6c), `neotest` on
      # hardware keys, Back. Then Files (R8), from the menu (89,735): Z: card (270,315) -> Sys (row 2, y 358: private, Resource, Sys, System) -> Bin
      # (row 0, y 142), Back -> Data (row 1) -> estart.txt (row 0) in the viewer, Back x4 to the drives; C: card
      # (270,135) -> Options (452,1033) -> New folder (270,756) -> `neo` on the keyboard; Options -> Delete (270,924)
      # -> the neo row (row 0) -> Delete in the dialog (430,553); Back x2 (C:\ -> drives -> the app closes).
      # R10: apps keep running -- Back returns to the menu (where the toolbar's middle button now opens Open apps), so
      # each app is opened from the menu directly; then Terminal is reopened (resumed, not restarted), and Open apps
      # (menu toolbar middle, 270,1000) closes all three with the first card's x (227,88).
      - name: Boot at 539x1079; Clock; Terminal (ESHELL, dir by touch, neotest); Files; resume; Open apps closes all
        working-directory: build
        run: |
          export SCREEN=539x1079
          . ../neoui/symbian/taps.sh
          tap 270 1000
          tap 449 530; expect "clock: surface"
          tap 270 500; expect "clock: touch"
          tap 88 1033; expect "clock: visible false"
          tap 449 735; expect "term| Copyright"; wait_s 1
          kb_type dir; expect "term| Directory of C:"
          type_text neotest; expect "passed, 0 failed"
          tap 88 1033
          tap 89 735; expect "files: drives"
          tap 270 315; expect "files: list"; tap 270 358; expect "files: list"; tap 270 142; expect "files: list"
          tap 88 1033; expect "files: list"; tap 270 250; expect "files: list"; tap 270 142; expect "files: view"
          for i in 1 2 3; do tap 88 1033; expect "files: list"; done
          tap 88 1033; expect "files: drives"
          tap 270 135; expect "files: list"; tap 452 1033; tap 270 756
          kb_type neo; expect "files: mkdir"
          tap 452 1033; tap 270 924; tap 270 142; tap 430 553; expect "files: delete"
          tap 452 1033; tap 270 756; kb_globe; kb_globe
          kb_tap 2 8.5 12; kb_tap 2 6.5 12; kb_tap 1 5 12; kb_enter; expect "files: mkdir"
          tap 88 1033; expect "files: drives"; tap 88 1033
          tap 449 735; tap 88 1033
          tap 270 1000
          for i in 1 2 3; do tap 227 88; expect "exited (type 0"; done
          MON_GAP=0.1 MONITOR="$M" SECS=300 ./boot.sh

      - name: Check the output
        working-directory: build
        run: |
          s=out/serial.log
          grep -a '\[proc\] create SYSSTART.EXE' $s
          ! grep -aq '\[proc\] create EWSRV.EXE' $s
          grep -a 'neoui: display 539x1079' $s
          grep -a 'neoui: launcher shown' $s
          grep -aE 'neoui: clock [0-9]{2}:[0-9]{2}' $s
          # R9: frame timing (one summary per second of activity) on the fast counter
          grep -aE 'neoui: fast counter [1-9][0-9]* Hz' $s
          grep -aE 'neoui: perf [0-9]+ frames/[0-9]+ ms: render avg' $s
          # R5: the first tap (Apps) redrew most of the screen
          px=$(grep -ao 'neoui: tap from .* redrew [0-9]*' $s | grep -o '[0-9]*$' | head -1)
          echo "redrew $px px"; [ "${px:-0}" -gt 100000 ]
          # R6: an app as its own process, in a shared surface, getting input, leaving on Back
          grep -a 'neoui: screen menu' $s
          grep -a 'neoui: screen clock' $s
          grep -a 'neoui: app clock started' $s
          grep -a 'neoui: app clock surface 539x' $s
          grep -a 'clock: surface 539x[0-9]* mapped' $s
          ticks=$(grep -ao 'clock: tick [0-9:]*' $s | sort -u | wc -l)
          echo "$ticks distinct ticks"; [ "$ticks" -ge 2 ]
          grep -a 'clock: touch ' $s
          grep -a 'clock: quit' $s
          grep -a 'neoui: app clock exited (type 0, reason 0)' $s
          # R6b: ESHELL in the Terminal app, through the stock econs.dll and our !E32WindowServer
          grep -a 'neoui: app terminal started' $s
          grep -a 'term: eshell started' $s
          grep -a 'term| ESHELL 0.01' $s
          # R6c: the system keyboard opened for the Terminal and typed `dir` (no hardware key sent it)
          grep -a 'neoui: keyboard 2 for terminal' $s
          grep -a 'term| C:\\>dir' $s
          grep -a 'term| Directory of C:' $s
          grep -a 'term| C:\\>neotest' $s
          grep -aE 'neotest: [0-9]+ passed, 0 failed' $s
          grep -a 'term: quit' $s
          grep -a 'neoui: app terminal exited (type 0, reason 0)' $s
          # R8: the Files app on the file server -- drives, a 40+ entry listing, the text viewer, mkdir and delete
          # typed and tapped, Back walking up (claimed) and finally closing the app (unclaimed at the drive list)
          grep -a 'neoui: app files started' $s
          grep -aE 'files: drives C\([0-9]+/[0-9]+\) Z\(' $s
          n=$(grep -ao 'files: list Z:\\Sys\\Bin\\ [0-9]*' $s | grep -o '[0-9]*$' | head -1)
          test "${n:-0}" -gt 10
          grep -a 'files: view Z:\\Sys\\Data\\estart.txt 1' $s
          grep -a 'neoui: keyboard 1 for files' $s
          grep -a 'files: mkdir C:\\neo\\ 0' $s
          grep -a 'files: delete C:\\neo\\ 0' $s
          # the keyboard's globe key, twice (English -> Armenian -> Russian), and a folder named "дом" on the FAT C:
          grep -a 'files: mkdir C:' $s | grep -av 'C:\\neo\\' | grep -aq '\\ 0'
          grep -a 'files: quit' $s
          grep -a 'neoui: app files exited (type 0, reason 0)' $s
          # R10: Back keeps apps running (Clock is told it is hidden); Terminal comes back with its ESHELL session;
          # Open apps closes each one, and every app quits by itself (none killed)
          grep -a 'clock: visible false' $s
          grep -a 'neoui: app terminal resumed' $s
          test "$(grep -ac 'neoui: app terminal started' $s)" = 1
          grep -a 'neoui: screen switcher' $s
          for a in clock terminal files; do grep -a "neoui: app $a closed" $s; done
          ! grep -aq 'killed (did not quit)' $s
          ! grep -aq 'K::Fault\|Kern::Fault\|\[EKERN\] panic\|rust panic' $s
          python3 - <<'PY'
          d = open("out/fb.ppm", "rb").read()
          assert d.startswith(b"P6\n539 1079\n255\n"), d[:20]
          px = d[len(b"P6\n539 1079\n255\n"):]
          colours = {px[i:i + 3] for i in range(0, len(px), 3 * 97)}
          assert len(colours) > 8, f"screen looks blank: {len(colours)} colours"
          print(f"fb.ppm: 539x1079, {len(colours)} sampled colours")
          PY

      # P2 (legacy apps): "Old apps" in the menu (270,930) starts LEGACY.EXE (NeoSymbian/build apps/legacy), which runs
      # the stock 2010 window server as a guest in a shared buffer (graphics fork: scnew.cpp, WSTOP.CPP, EVENT.CPP) and
      # the Symbian Foundation's MiniGUI grid.exe in it; a tap in its window reaches it as a raw pointer event. grid
      # draws for 3 s and exits, and LEGACY with it.
      - name: Boot again; Old apps (a 2010 window-server program inside neoui)
        working-directory: build
        run: |
          cp out/serial.log out/serial-main.log
          export SCREEN=539x1079
          . ../neoui/symbian/taps.sh
          tap 270 1000
          tap 270 930; expect "create grid"
          tap 200 300; expect "legacy: raw"
          expect "neoui: app legacy exited"
          MON_GAP=0.1 MONITOR="$M" SECS=120 ./boot.sh
          s=out/serial.log
          grep -a 'neoui: app legacy started' $s
          grep -a '\[proc\] create EWSRV.EXE' $s
          grep -aE 'legacy: guest wserv 539x1079 up, surface 539x[0-9]+' $s
          grep -a '\[proc\] create grid.exe' $s
          grep -aE 'legacy: raw 10 [0-9]+ [0-9]+' $s
          grep -a 'legacy: closing' $s
          grep -a 'neoui: app legacy exited (type 0, reason 0)' $s
          ! grep -aq 'K::Fault\|Kern::Fault\|\[EKERN\] panic\|rust panic' $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syborg
          path: |
            build/out/fb.png
            build/out/serial.log
            build/out/serial-main.log
