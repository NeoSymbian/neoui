# SPDX-License-Identifier: Apache-2.0
name: virt-taps

# The launcher on the 2010 Symbian user side, on QEMU virt with our AArch64 kernel (docs user-side-smp.md US6b; until
# 2026-11-25 this ran on Syborg): build symbian/ (SYSSTART.EXE) for ARMv8, put it in the ROM with NeoSymbian/build
# (estart then runs it instead of the window server) with the apps, boot it on virt (539x1079 ramfb screen, virtio
# tablet and keyboard), drive it through QMP (NeoSymbian/neoqemu's ui-qemu.py in the toolchain image, scripts from
# symbian/taps.sh) and check the serial log and the screen. Only the screenshot and logs are published, never the ROM
# (it links Slint under GPL-3.0 with EPL-1.0 Symbian code).
on:
  push:
    branches: [main]     # a PR branch runs once, as its pull_request
    paths-ignore: ['**/*.md', 'docs/**', 'snapshots/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'snapshots/**']
  workflow_dispatch:

# a newer push to the same PR cancels its older run; main keeps one result per commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  virt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: neoui

      - uses: actions/checkout@v4
        with:
          repository: NeoSymbian/build
          path: build

      - name: Rust toolchain (pinned by symbian/rust-toolchain.toml)
        working-directory: neoui/symbian
        run: rustup toolchain install   # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neoui/symbian -> target

      - name: Rust
        working-directory: neoui/symbian
        run: |
          cargo fmt --all --check
          cargo clippy-arm --workspace -- -D warnings
          cargo arm --workspace
          mkdir -p ../../build/rust
          cp target/armv8a-neosymbian-eabi/release/{libneoui_symbian,libneoclock,libneoterm,libneodevtools,libneokit,libneoset}.a exes.txt ../../build/rust/

      # NeoSymbian/phone: NEOPHONE.EXE (Phone), NEOCONT.EXE (Contacts), NEOMSG.EXE (Messages). Phone and Messages are
      # resident (host::RESIDENT); the three open each other (ipc OPEN, protocol 1.9).
      - name: NeoSymbian/phone
        run: |
          git clone -q --depth 1 https://github.com/NeoSymbian/phone.git
          cd phone/symbian && cargo arm
          cp target/armv8a-neosymbian-eabi/release/{libneophone,libneocont,libneomsg}.a ../../build/rust/
          grep -E '^NEO(PHONE|CONT|MSG)\.EXE' exes.txt >> ../../build/rust/exes.txt

      # NeoSymbian/files: NEOFILES.EXE (Files; moved out of neoui, docs files-app.md FA0). The shell starts it by its
      # key, `files` (host::APPS).
      # FILES_REF: a branch while a files change and its taps here are reviewed together; main otherwise
      - name: NeoSymbian/files
        env:
          FILES_REF: main
        run: |
          git clone -q --depth 1 --branch "$FILES_REF" https://github.com/NeoSymbian/files.git
          cd files/symbian && cargo arm
          cp target/armv8a-neosymbian-eabi/release/libneofiles.a ../../build/rust/
          grep -E '^NEOFILES\.EXE' exes.txt >> ../../build/rust/exes.txt

      # NEOTEST.EXE (e32-rs's on-device tests), so ESHELL in the Terminal app has a 2010-style text program to run
      # NEOSRV.EXE too: neotest's fs_share starts it (a file handle passed between processes)
      - name: e32-rs neotest
        run: |
          git clone -q --depth 1 https://github.com/NeoSymbian/e32-rs.git
          cd e32-rs && cargo arm -p neotest -p neosrv
          cp target/armv8a-neosymbian-eabi/release/{libneotest,libneosrv}.a ../build/rust/
          grep -E '^NEO(TEST|SRV)\.EXE' symbian/exes.txt >> ../build/rust/exes.txt

      - name: Fetch the Symbian sources
        working-directory: build
        run: ./fetch.sh

      # the 2010 user side already built for this build commit (build CI publishes it on main), else the full build
      - name: Prebuilt base (ghcr.io/neosymbian/userside-base:<build commit>)
        working-directory: build
        run: |
          t=ghcr.io/neosymbian/userside-base:$(git rev-parse HEAD)
          if docker pull -q "$t"; then docker run --rm -v neosymbian-build:/build "$t" cp -a /base/. /build/
          else echo "no prebuilt base for build $(git rev-parse --short HEAD): the full build"; fi

      - name: Build the ROM (SYSSTART.EXE = the UI server, no window server; NEOCLOCK/NEOTERM/NEOFILES.EXE = apps)
        working-directory: build
        run: ./build.sh

      - name: The AArch64 kernel for QEMU virt, with this user side
        working-directory: build
        run: KERNEL=src/oss.FCL.sf.os.kernelhwsrv ./neo kernel qemu

      # A phone-shaped screen with odd sizes (half of the Pixel's 1079x2159 touch range), so the UI must adapt to
      # whatever the device reports. The path is the design's contract, in screen pixels (1 dp = 1.497 px; Navigation
      # v2, docs neoui-shell/navigation.md and neoui-shell/kit.md):
      # - The status bar is 37 px and a header 72 px, so shell screens and apps start their content at y 109.
      # - Buttons' key row is 84 px: ← (90,1037), ⌂ (270,1037), ▢ (449,1037).
      # - Gestures' band is 24 px. In the home dock, Apps is at (485,973) in Gestures and (485,913) in Buttons.
      # - Apps menu tiles, 3 to a row: x 90, 270, 449; rows at y 199, 401, 603, 805. Clock is (449,603), Files
      #   (90,805), Settings (270,805), Terminal (449,805).
      # The steps:
      # - Gestures is the default. Settings (the NEOSET app, docs neoui-shell/settings.md) -> Home & navigation
      #   (270,672) -> Buttons (270,220), one of three choices (Gestures 270,355; N9 270,490). The app logs
      #   "settings: page <name>"; the store's later "settings saved" shows the write went through (by NEOSET's SID).
      # - Clock; a tap inside it (270,500); ←.
      # - Terminal: `dir` on the system keyboard (R6c, above the key row), `neotest` on hardware keys, the keyboard's
      #   hide key, ←.
      # - Files (v2, files-app.md FA1/FA2; rows 64 dp from y 120 dp, from 220.5 dp under a read-only drive's banner):
      #   the Z: row (270,341) -> Sys (row 2, y 559) -> Bin (row 0, y 367); ← -> Data (row 1, 463) -> estart.txt
      #   (row 0) in the viewer; ← to Data; a long press on estart.txt -> the selection header's Copy (359,73): the
      #   paste bar; ← x3 to the drives.
      # - Files on C: (270,220): the paste bar's Paste here (449,877) copies estart.txt on the worker; ⋮ (503,73) ->
      #   New folder (400,157) -> `neo` on the keyboard; a long press on the neo row (row 0, y 217) -> the selection
      #   header's Delete (431,73) -> Move to bin in the shell's dialog (297,524): into C:\.trash\.
      # - Files again: New folder with the globe key twice (Russian); ← to the drives.
      # - FA3: the Recent tab (270,958: the footer's middle, 615 dp) lists estart.txt; root ⋮ -> Recycle bin
      #   (400,157); a long press on its one row (y 302, under the "Kept for 30 days" card) -> Restore (359,73); ← to
      #   Recent; search (431,73), "дом" on the keyboard (still Russian; no Enter); ← hides the keyboard, ← closes
      #   search.
      # - FA4: Browse (90,958) -> C: -> ⋮ -> New file (400,229) -> ✓ (503,73) opens the editor with the keyboard up;
      #   "42" on the digit row; Save (431,73); ← hides the keyboard, ← to the viewer, ← to C:\, ← to the drives, ← leaves.
      # - R10: apps keep running, and ← returns to the menu, so each app is opened from the menu directly. Terminal is
      #   reopened (resumed, not restarted). Open apps (▢) closes all four (Settings too) with the first card's × (227,160).
      # - Last, Settings again: Gestures, for the later steps.
      - name: Boot on virt (539x1079); Clock; Terminal (ESHELL, dir by touch, neotest); Files; resume; Open apps closes all
        working-directory: build
        run: |
          export SCREEN=539x1079 NAV=buttons
          . ../neoui/symbian/taps.sh
          tap 485 973; tap 270 805; expect "neoui: app settings surface"; wait_s 2
          tap 270 672; expect "settings: page navigation"; tap 270 220; expect "neoui: settings saved"
          tap 270 1037; tap 485 913   # home, then the menu, in Buttons
          tap 449 603; expect "clock: surface"; wait_s 2   # the clock ticks once a second while shown (checked below)
          tap 270 500; expect "clock: touch"
          tap 90 1037; expect "clock: visible false"
          tap 449 805; expect "term| Copyright"; wait_s 1
          kb_type dir; expect "term| Directory of C:"
          type_text neotest; expect "passed, 0 failed"
          kb_hide term; tap 90 1037
          tap 90 805; expect "files: drives"
          tap 270 341; expect "files: list"; tap 270 559; expect "files: list"; tap 270 367; expect "files: list"
          tap 90 1037; expect "files: list"; tap 270 463; expect "files: list"; tap 270 367; expect "files: view"
          tap 90 1037; expect "files: list"
          hold 270 367; tap 359 73
          for i in 1 2; do tap 90 1037; expect "files: list"; done
          tap 90 1037; expect "files: drives"
          tap 270 220; expect "files: list"; tap 449 877; expect "bytes to C:"
          tap 503 73; tap 400 157
          kb_type neo; expect "files: mkdir"
          hold 270 217; tap 431 73; tap 297 524; expect "files: trash"
          tap 503 73; tap 400 157; kb_globe; kb_globe
          kb_tap 2 8.5 12; kb_tap 2 6.5 12; kb_tap 1 5 12; kb_enter; expect "files: mkdir"
          tap 90 1037; expect "files: drives"
          tap 270 958; expect "files: recent 1"
          tap 503 73; tap 400 157; expect "files: bin 1"
          hold 270 302; tap 359 73; expect "files: restore 1"
          tap 90 1037; expect "files: recent 1"
          tap 431 73; kb_tap 2 8.5 12; kb_tap 2 6.5 12; kb_tap 1 5 12; expect "files: search"
          tap 90 1037; tap 90 1037
          tap 90 958; expect "files: drives"; tap 270 220; expect "files: list"
          tap 503 73; tap 400 229; tap 503 73; expect "files: edit"
          wait_s 1; kb_tap 4 3 10; kb_tap 4 1 10; tap 431 73; expect "files: save"
          tap 90 1037; tap 90 1037; expect "files: view"
          tap 90 1037; expect "files: list"; tap 90 1037; expect "files: drives"; tap 90 1037
          tap 449 805; kb_hide term; tap 90 1037
          tap 449 1037
          for i in 1 2 3 4; do tap 227 160; expect "exited (type 0"; done
          tap 270 1037; tap 485 913; tap 270 805; expect "neoui: app settings surface"; wait_s 2
          tap 270 672; expect "settings: page navigation"; tap 270 355; expect "neoui: settings saved"
          # SE1d: back to the root (←), search (🔍 426,73) "apps" on the keyboard (now in Gestures), the first result
          # (app y 80 dp) -> Apps; its first row, Clock (118 dp), opens the app's page (SE4a); Open (84 dp) opens Clock
          NAV=gestures
          wait_s 1; tap 36 73; expect "settings: back"
          tap 426 73; wait_s 1; kb_globe; kb_type apps   # the keyboard is still Russian (Files): globe -> English
          tap 270 157; expect "settings: page apps"; wait_s 1
          tap 270 214; expect "settings: page app"; wait_s 1
          tap 270 126; expect "settings: open app clock (Ok"; expect "clock: visible true"
          # SE4a: Settings again (resumes on Clock's page); Stop (156 dp) -> the shell's dialog "Stop Clock?" -> its
          # Stop (first of two buttons at the dialog's right, 297,566): the shell closes Clock
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"   # Clock is in front: home first
          tap 485 973; tap 270 805; expect "neoui: app settings resumed"; wait_s 2
          tap 270 234; wait_s 1; tap 297 566; expect "neoui: settings stops app clock"; expect "clock: quit"
          # SE2a, Offline (virt is the only device it may run on): ← to Apps, ← to the root,
          # search "offline" -> its row on Sounds (406 dp) -> the sheet's Activate (529 dp): airplane on, Wi-Fi and BT
          # off; then General (118 dp) -> Activate: everything as it was
          wait_s 1; tap 36 73; expect "settings: back"; wait_s 1; tap 36 73; expect "settings: back"
          tap 426 73; wait_s 1; kb_type offline
          tap 270 157; expect "settings: page sounds"; wait_s 1
          tap 270 645; wait_s 1; tap 270 829; expect "neoui: sound profile 4: airplane true, wifi false, bt false"
          wait_s 1; tap 270 214; wait_s 1; tap 270 829; expect "neoui: sound profile 0: airplane false, wifi true, bt false"
          ui_run 400

      - name: Check the output
        working-directory: build
        run: |
          s=out/serial.log
          grep -a '\[proc\] SYSSTART.EXE\[' $s   # the AArch64 kernel's "[proc] NAME[uid]0001 starts"
          ! grep -aq '\[proc\] EWSRV.EXE\[' $s
          grep -a 'neoui: display 539x1079' $s
          grep -a 'neoui: launcher shown' $s
          # Settings is an app (NEOSET): it starts, and its writes to shell settings are allowed by its secure ID
          grep -a 'neoui: app settings started' $s
          grep -a 'settings: set nav.mode = 0 (Ok' $s
          # SE1d: search found Apps, and its sheet opened Clock
          grep -a 'settings: page apps' $s
          grep -a 'settings: open app clock (Ok' $s
          # SE4a: Clock's page stopped it through the shell
          grep -a 'neoui: settings stops app clock' $s
          grep -a 'clock: quit' $s
          # SE2a: Offline turned the radios off, General gave them back
          grep -a 'neoui: sound profile 4: airplane true, wifi false, bt false' $s
          grep -a 'neoui: sound profile 0: airplane false, wifi true, bt false' $s
          ! grep -aq 'settings: set nav.mode = [0-9] (Err' $s
          grep -aE 'neoui: clock [0-9]{2}:[0-9]{2}' $s
          # R9: frame timing (one summary per second of activity) on the fast counter
          grep -aE 'neoui: fast counter [1-9][0-9]* Hz' $s
          grep -aE 'neoui: perf [0-9]+ frames/[0-9]+ ms: render avg' $s
          # R5: the first tap (Apps) redrew most of the screen
          px=$(grep -ao 'neoui: tap from .* redrew [0-9]*' $s | grep -o '[0-9]*$' | head -1)
          echo "redrew $px px"; [ "${px:-0}" -gt 100000 ]
          # R6: an app as its own process, in a shared surface, getting input, leaving on Back
          grep -a 'neoui: screen menu' $s
          grep -a 'neoui: screen clock' $s
          grep -a 'neoui: app clock started' $s
          grep -a 'neoui: app clock surface 539x' $s
          grep -a 'clock: surface 539x[0-9]* mapped' $s
          ticks=$(grep -ao 'clock: tick [0-9:]*' $s | sort -u | wc -l)
          echo "$ticks distinct ticks"; [ "$ticks" -ge 2 ]
          grep -a 'clock: touch ' $s
          grep -a 'clock: quit' $s
          grep -a 'neoui: app clock exited (type 0, reason 0)' $s
          # R6b: ESHELL in the Terminal app, through the stock econs.dll and our !E32WindowServer
          grep -a 'neoui: app terminal started' $s
          grep -a 'term: eshell started' $s
          grep -a 'term| ESHELL 0.01' $s
          # R6c: the system keyboard opened for the Terminal and typed `dir` (no hardware key sent it)
          grep -a 'neoui: keyboard 2 for terminal' $s
          grep -a 'term| C:\\>dir' $s
          grep -a 'term| Directory of C:' $s
          grep -a 'term| C:\\>neotest' $s
          grep -aE 'neotest: [0-9]+ passed, 0 failed' $s
          grep -a 'term: quit' $s
          grep -a 'neoui: app terminal exited (type 0, reason 0)' $s
          # The Files app on the file server -- drives, a 40+ entry listing, the text viewer, a copy on the worker
          # through the paste bar, mkdir and the Recycle bin, Back walking up (claimed) and finally closing the app
          # (unclaimed at the drives)
          grep -a 'neoui: app files started' $s
          grep -aE 'files: drives C\([0-9]+/[0-9]+\) Z\(' $s
          n=$(grep -ao 'files: list Z:\\Sys\\Bin\\ [0-9]*' $s | grep -o '[0-9]*$' | head -1)
          test "${n:-0}" -gt 10
          grep -aE 'files: view Z:\\Sys\\Data\\estart.txt [0-9]+' $s
          grep -a 'neoui: keyboard 1 for files' $s
          grep -a 'files: mkdir C:\\neo\\ 0' $s
          grep -aE 'files: copy 1 files [0-9]+ bytes to C:\\ done' $s
          grep -a 'files: trash C:\\neo\\ 0' $s
          # FA3: the index walked on its worker, Recent, the bin's Restore, search over the index (the C:\дом\ folder)
          grep -aE 'files: index [0-9]+ entries in [0-9]+ ms' $s
          grep -a 'files: restore 1 0' $s
          grep -aE 'files: search "дом" [1-9]' $s
          # FA4: New file opens the editor; "42" typed and saved, byte-exact (2 bytes); Back to the viewer
          grep -a 'files: newfile C:\\New file.txt 0' $s
          grep -a 'files: save C:\\New file.txt 2 0' $s
          grep -a 'files: view C:\\New file.txt' $s
          # the keyboard's globe key, twice (English -> Armenian -> Russian), and a folder named "дом" on the FAT C:
          grep -a 'files: mkdir C:' $s | grep -av 'C:\\neo\\' | grep -aq '\\ 0'
          grep -a 'files: quit' $s
          grep -a 'neoui: app files exited (type 0, reason 0)' $s
          # R10: Back keeps apps running (Clock is told it is hidden); Terminal comes back with its ESHELL session;
          # Open apps closes each one, and every app quits by itself (none killed)
          grep -a 'clock: visible false' $s
          grep -a 'neoui: app terminal resumed' $s
          test "$(grep -ac 'neoui: app terminal started' $s)" = 1
          grep -a 'neoui: screen switcher' $s
          for a in clock terminal files; do grep -a "neoui: app $a closed" $s; done
          ! grep -aq 'killed (did not quit)' $s
          ! grep -aq 'K::Fault\|Kern::Fault\|\[EKERN\] panic\|rust panic' $s
          # the screen QMP's screendump saw (ramfb): the right size, not blank
          . ./images.sh
          docker run --rm -v "$PWD/out:/o:ro" "$BUILD_IMAGE" python3 -I -c '
          from PIL import Image
          im = Image.open("/o/fb.png").convert("RGB")
          assert im.size == (539, 1079), im.size
          px = im.tobytes()
          colours = {px[i:i + 3] for i in range(0, len(px), 3 * 97)}
          assert len(colours) > 8, f"screen looks blank: {len(colours)} colours"
          print(f"fb.png: 539x1079, {len(colours)} sampled colours")'

      # P2 (legacy apps), in Gestures (the main step left it so): Apps in the dock (485,973) -> "Old apps" in the menu
      # (270,1007) starts LEGACY.EXE (NeoSymbian/legacy host/). It runs the stock 2010 window server as a guest in a
      # shared buffer (graphics fork: scnew.cpp, WSTOP.CPP, EVENT.CPP) and the AppArc apps in it. The first tile of its
      # grid (90,202), under the shell's header, starts the first app (PerfMon in this ROM); a tap in its window reaches
      # it as a raw pointer event (legacy: raw 10 x y). Old apps draw their own title bar, so Back is the left edge's
      # swipe, which closes it (FRONT 0); two more go back to the menu and home.
      # Then the phone apps: Phone in the dock (54,973) brings the resident NEOPHONE to the front (its dial pad); two
      # left-edge swipes go home. Apps (485,973) -> Contacts in the menu (449,199) starts NEOCONT; two swipes go home again. Messages in
      # the dock (162,973) brings the resident NEOMSG; its footer's Contacts tab (270,1019: the middle third, 24 dp over
      # the band) opens Contacts from Messages (ipc OPEN).
      - name: Boot again; Old apps (the AppArc grid, its first app); Phone, Contacts and Messages (three apps)
        working-directory: build
        run: |
          cp out/serial.log out/serial-main.log
          export SCREEN=539x1079 NAV=gestures
          . ../neoui/symbian/taps.sh
          tap 485 973
          tap 270 1007; expect "legacy: app "
          wait_s 3; tap 90 202; expect "legacy: start app"
          wait_s 5; tap 200 300; expect "legacy: raw"
          swipe 5 540 200 540; expect "neoui: app legacy front false"   # Back (the left edge)
          wait_s 2; swipe 5 540 200 540; wait_s 2; swipe 5 540 200 540; wait_s 3   # the grid, then the menu, then home
          tap 54 973; expect "neoui: screen phone"
          # Phone opens on its dial pad (NEOPHONE v2): Back shows the call list, a second Back goes home
          wait_s 1; swipe 5 540 200 540; wait_s 1; swipe 5 540 200 540; expect "neoui: screen home"
          wait_s 1; tap 485 973; tap 449 199; expect "neocont: connected"
          wait_s 1; swipe 5 540 200 540; wait_s 2; swipe 5 540 200 540; wait_s 2   # Contacts -> the menu -> home
          tap 162 973; expect "neoui: screen messages"
          wait_s 2; tap 270 1019; expect "neoui: messages opens contacts"
          ui_run 180
          s=out/serial.log
          grep -a 'neoui: app legacy started' $s
          grep -a '\[proc\] EWSRV.EXE\[' $s
          grep -aE 'legacy: guest wserv 360x640 up, surface 539x[0-9]+' $s
          # protocol 1.6: the AppArc apps as Old apps tiles; the first one starts (FRONT 1), takes a touch, and Back closes
          # it (FRONT 0); LEGACY stays resident behind the grid
          grep -aE "legacy: app [0-9a-f]{8} '" $s
          grep -aE 'legacy: start app [0-9a-f]{8}: 0' $s
          grep -aE 'legacy: raw 10 [0-9]+ [0-9]+' $s
          grep -a 'neoui: app legacy front true' $s
          grep -a 'neoui: app legacy front false' $s
          grep -a 'neoui: screen home' $s
          # Phone and Messages start hidden at boot, one at a time (host::keep_resident)
          grep -a 'neoui: app phone started' $s
          grep -a 'neoui: app messages started' $s
          grep -a 'neoui: screen phone' $s
          grep -a 'neoui: app contacts started' $s
          grep -a 'neocont: connected' $s
          grep -a 'neoui: screen messages' $s
          grep -a 'neoui: messages opens contacts page 0' $s
          grep -a 'neocont: opened on page 0' $s
          ! grep -aq 'K::Fault\|Kern::Fault\|\[EKERN\] panic\|rust panic' $s

      # Navigation v2's gestures (docs neoui-shell/navigation.md; edge zone 16 dp = 24 px, sides and the band commit at 72 dp =
      # 108 px, Home at 80 dp = 120 px). The Thumb map (Gestures, the default):
      # - Settings (via Apps 485,973 and 270,805; the NEOSET app) -> Home & navigation (270,672).
      # - The left edge goes Back (the app's page back to its root), the right edge too (the app leaves for the menu).
      # - Up from the bottom goes Home, and from home to the menu.
      # - Clock (449,603). Up and held still for Open apps.
      # - Clock again from the menu; along the band rightwards: the previous app.
      # - Clock's ⋮ (497,73) -> Settings (400,157), the kit's menu.
      # - Protocol 1.12 (Files FA8): the UI kit (Apps row 4, 449,985) -> ⋮ (500,73) -> Files (menu row 9, 400,805) ->
      #   Save a file (270,244) opens Files' Save as on C:\ (no C:\Data there); its Save (470,998) answers the kit
      #   with the new file by handle, and the kit writes into it.
      # Then the N9 map (Settings, still running at its root -> Home & navigation -> N9 gestures, 270,490): the right
      # edge's drag is Open apps.
      - name: Boot again; gesture navigation (the Thumb map, then N9)
        working-directory: build
        run: |
          cp out/serial.log out/serial-legacy.log
          export SCREEN=539x1079 NAV=gestures
          . ../neoui/symbian/taps.sh
          tap 485 973; tap 270 805; expect "neoui: app settings surface"; wait_s 2
          tap 270 672; expect "settings: page navigation"; wait_s 1
          swipe 5 540 200 540; expect "neoui: gesture back"; expect "settings: back"
          wait_s 1; swipe 534 540 340 540; expect "neoui: screen menu"
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen menu"
          wait_s 1; tap 449 603; expect "clock: surface"
          wait_s 1; swipe_hold 270 1075 270 900; expect "neoui: screen switcher"
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"
          wait_s 1; tap 485 973; tap 449 603; expect "clock: visible true"
          wait_s 1; swipe 100 1072 400 1072; expect "neoui: gesture prev"; expect "neoui: screen settings"
          # (the previous app is Settings, now an app itself): home, then Clock from the menu again
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"
          wait_s 1; tap 485 973; tap 449 603; expect "clock: visible true"
          wait_s 1; tap 497 73; wait_s 1; tap 400 157; expect "clock: view settings"
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"
          wait_s 1; tap 485 973; tap 449 985; expect "neoui: app kit started"
          wait_s 1; tap 500 73; wait_s 1; tap 400 805; wait_s 1
          tap 270 244; expect "files: opened on page 2"; wait_s 2
          tap 470 998; expect "kit: saved"
          wait_s 1; swipe 270 1075 270 900; expect "neoui: screen home"
          wait_s 1; tap 485 973; tap 270 805; wait_s 2
          tap 270 672; expect "settings: page navigation"; tap 270 490; expect "neoui: settings saved"; wait_s 1
          swipe 534 540 340 540; expect "neoui: screen switcher"
          ui_run 180
          s=out/serial.log
          # the Thumb map has no "menu" gesture: Home on the home screen shows the menu (the script's expect checks it)
          for g in back home apps prev; do grep -a "neoui: gesture $g" $s; done
          grep -a 'clock: view settings' $s
          grep -a 'clock: visible false' $s
          # protocol 1.12: Files' Save as answered the kit with a file it wrote through the handle
          grep -a 'neoui: kit opens files page 2' $s
          grep -a 'files: saved C:\\note.txt for the caller' $s
          grep -a 'neoui: app files done with a file for Some("kit")' $s
          grep -a 'kit: saved C:\\note.txt 15 bytes' $s
          ! grep -aq 'K::Fault\|Kern::Fault\|\[EKERN\] panic\|rust panic' $s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virt-taps
          path: |
            build/out/fb.png
            build/out/serial.log
            build/out/serial-main.log
            build/out/serial-legacy.log
