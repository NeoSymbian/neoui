# SPDX-License-Identifier: GPL-3.0-only
# The neoui launcher as a Symbian EXE (SYSSTART.EXE: estart runs it instead of the window server). Its own workspace:
# it is built only for armv5te-none-eabi with a pinned nightly (build-std), unlike the host crates around it.
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06: revisit before any ROM release).
[package]
name = "neoui-symbian"
description = "The neoui launcher on the 2010 Symbian user side: frame buffer + raw input, no window server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
neoui-render = { path = "../crates/neoui-render" }
neoui-proto = { path = "../crates/neoui-proto" }
e32 = { workspace = true }
# build info (neoapp::build): the kernel's and the ROM's stamps, shared with Dev tools
neoapp = { workspace = true }
# NeoSymbian/telephony: the NeoModem server's contract (MODEMD.EXE; Apache-2.0)
modem-ipc = { workspace = true }
# NeoSymbian/neolink: the WPA2-PSK supplicant handshakes (Wi-Fi W4; Apache-2.0)
wpa = { git = "https://github.com/NeoSymbian/neolink", rev = "7db5000285acb4be606b3a4320048dfc6c195c1c" }

[workspace]
members = ["apps/clock", "apps/term", "apps/files", "apps/devtools", "neoapp"]

[workspace.dependencies]
# NeoSymbian/e32-rs: the Symbian user-side runtime (exec calls, heap, display, raw input, IPC, processes).
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "e97e2ebcb242f5365d1b3f9d520646603e1e9056", features = ["critical-section"] }
neoui-proto = { path = "../crates/neoui-proto" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = { version = "=1.18.1", features = ["sdf-fonts"] }
neoapp = { path = "neoapp" }
modem-ipc = { git = "https://github.com/NeoSymbian/telephony", rev = "1bbe3521f9b04c4501ed9ac199b8f55b6be38ee2" }
neoui-term = { path = "../crates/neoui-term" }
neoui-files = { path = "../crates/neoui-files" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
