# SPDX-License-Identifier: GPL-3.0-only
# The neoui launcher as a Symbian EXE (SYSSTART.EXE: estart runs it instead of the window server). Its own workspace:
# it is built only for targets/armv8a-neosymbian-eabi.json with a pinned nightly (build-std), unlike the host crates.
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06: revisit before any ROM release).
[package]
name = "neoui-symbian"
description = "The neoui launcher on the 2010 Symbian user side: frame buffer + raw input, no window server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
neoui-render = { path = "../crates/neoui-render" }
neoui-proto = { path = "../crates/neoui-proto" }
e32 = { workspace = true }
# build info (neoapp::build): the kernel's and the ROM's stamps, shared with Dev tools
neoapp = { workspace = true }
# NeoSymbian/neohw: the NeoModem server's contract (MODEMD.EXE; Apache-2.0)
modem-ipc = { workspace = true }
# NeoAudio's contract (MODEMD.EXE serves it; Settings -> Sound -> Media, docs/hardware/audio.md; Apache-2.0)
neoaudio = { workspace = true }
# telephony C8: dial-string rules (the SIM prompt's emergency call; Apache-2.0)
phone-rules = { workspace = true }
# NeoSymbian/neohw: the NeoWifi contract (WIFID.EXE joins and runs WPA2, docs hardware.md S5; Apache-2.0)
wifi = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
# NeoSymbian/neohw: the NeoNet client (NEONET.EXE, the IP stack over Wi-Fi, W5; Apache-2.0).
net = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5", features = ["client"] }

[workspace]
members = ["apps/clock", "apps/term", "apps/devtools", "apps/kit", "neoapp"]

[workspace.dependencies]
# NeoSymbian/e32-rs: the Symbian user-side runtime (exec calls, heap, display, raw input, IPC, processes).
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "206b6c28cf49ef2f6e746580df97f05921500c35", features = ["critical-section"] }
neoui-proto = { path = "../crates/neoui-proto" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
neoapp = { path = "neoapp" }
modem-ipc = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
# NeoAudio's contract and tone helper (docs/hardware/audio.md; Apache-2.0)
neoaudio = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
phone-rules = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
# NeoLocation, GNSSD.EXE's contract (docs hardware/gnss.md; Apache-2.0)
loc = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
neoui-term = { path = "../crates/neoui-term" }
# the kit build helper (@neoui/kit.slint): every app's build.rs compiles its UI with it
neoui-kit = { path = "../crates/neoui-kit" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
