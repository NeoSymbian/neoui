# SPDX-License-Identifier: GPL-3.0-only
# The neoui launcher as a Symbian EXE (SYSSTART.EXE: estart runs it instead of the window server). Its own workspace:
# it is built only for armv5te-none-eabi with a pinned nightly (build-std), unlike the host crates around it.
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06: revisit before any ROM release).
[package]
name = "neoui-symbian"
description = "The neoui launcher on the 2010 Symbian user side: frame buffer + raw input, no window server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
neoui-render = { path = "../crates/neoui-render" }
neoui-proto = { path = "../crates/neoui-proto" }
e32 = { workspace = true }
# build info (neoapp::build): the kernel's and the ROM's stamps, shared with Dev tools
neoapp = { workspace = true }
# NeoSymbian/telephony: the NeoModem server's contract (MODEMD.EXE; Apache-2.0)
modem-ipc = { workspace = true }
# NeoAudio's contract (MODEMD.EXE serves it; Settings -> Sound -> Media, docs/audio.md; Apache-2.0)
neoaudio = { workspace = true }
# telephony C8: dial-string rules (the SIM prompt's emergency call; Apache-2.0)
phone-rules = { workspace = true }
# NeoSymbian/neolink: the WPA2-PSK supplicant handshakes (Wi-Fi W4; Apache-2.0)
wpa = { git = "https://github.com/NeoSymbian/neolink", rev = "3c19f03858e48dfbec42a3e29c52f59117d7eff3" }
# NeoSymbian/neolink: the NeoNet client (NEONET.EXE, the IP stack over Wi-Fi, W5; Apache-2.0).
net = { git = "https://github.com/NeoSymbian/neolink", rev = "3c19f03858e48dfbec42a3e29c52f59117d7eff3", features = ["client"] }

[workspace]
members = ["apps/clock", "apps/term", "apps/devtools", "apps/kit", "neoapp"]

[workspace.dependencies]
# NeoSymbian/e32-rs: the Symbian user-side runtime (exec calls, heap, display, raw input, IPC, processes).
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "e97e2ebcb242f5365d1b3f9d520646603e1e9056", features = ["critical-section"] }
neoui-proto = { path = "../crates/neoui-proto" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
neoapp = { path = "neoapp" }
modem-ipc = { git = "https://github.com/NeoSymbian/telephony", rev = "4095a4b7f34359fe8df25cd0e18e81c15be719c9" }
# NeoAudio's contract and tone helper (docs/audio.md; Apache-2.0)
neoaudio = { git = "https://github.com/NeoSymbian/telephony", rev = "eec7db1638d3b3d9e0e1276e9586b0dabd999929" }
phone-rules = { git = "https://github.com/NeoSymbian/telephony", rev = "4095a4b7f34359fe8df25cd0e18e81c15be719c9" }
neoui-term = { path = "../crates/neoui-term" }
# the kit build helper (@neoui/kit.slint): every app's build.rs compiles its UI with it
neoui-kit = { path = "../crates/neoui-kit" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
