[package]
name = "neoui-render"
description = "Slint software renderer driving the neoui launcher into a raw XRGB8888 buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neoui-proto.workspace = true
slint.workspace = true
# NeoSymbian/neohw: the SMS part counter for the inline reply (TP4; Apache-2.0, no_std), at the rev symbian/ pins
sms = { git = "https://github.com/NeoSymbian/neohw", rev = "87627092aa42b79bc77cd5ee7fbc17a536b43226" }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
png.workspace = true
